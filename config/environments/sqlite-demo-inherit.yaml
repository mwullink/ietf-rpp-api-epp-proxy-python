# The SQLite demo backend with presets and profiles that build on several bases (#180): planets-complete builds on two
# presets, habitable-worlds on two presets and applies a profile that builds on two profiles, one of which a base preset
# applies too, so that it counts once. Nothing is bound. The default preset is planets-complete. It is the test
# environment `sqlite-demo-inherit`.
include:
  - sqlite-demo.yaml

# The extensions this deployment is built with (docs/demo/).
rpp_extensions:
  - extensions.planets
  - extensions.planet_atmosphere
  - extensions.satellite_orbit

rpp_backend_profile:
  presets:
    - base
    - planets
    - planets-atmosphere
    - planets-orbits
    - planets-complete
    - catalogued-planets
    - habitable-worlds
  default_preset: planets-complete
