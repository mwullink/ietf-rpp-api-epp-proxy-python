# The SQLite demo backend (config/environments/sqlite-demo.yaml): bare RPP over a database with the planets and
# satellites of the demo extension, and what the other sqlite-demo-* descriptors include. It needs no credentials and no
# server: the app is built in memory, and the clients are those of the configuration, with the DEMO passwords of
# config/backends/sql.yaml (`literal` below: the values are not variable names).
preset: planets                       # the RPP preset the `{rpp:*}` placeholders stand for: the one the extension brings
max_workers: 8
regacc: user                           # the sponsor id is the login
registrars:                            # the slots the cases name
  a:
    literal: true
    user: demo-a
    password: demo-a-password
    prefix: ""
  b:
    literal: true
    user: demo-b
    password: demo-b-password
    prefix: ""
  c:                                   # c and d are for the cases about the message queue only
    literal: true
    user: demo-c
    password: demo-c-password
    prefix: ""
  d:
    literal: true
    user: demo-d
    password: demo-d-password
    prefix: ""
# Not a secret: a user the backend does not know, for the failed logins.
unknown_user:
  user: ghost
  password: nope

# The facts of its server are those of its configuration (`rpp_protocol_config`, config/common.yaml); the
# descriptor states its singular exceptions only.
facts:
  # Defects of this server, which the cases it breaks do not run on.
  bugs:
    over_max_length_cut: true          # a value longer than its column is stored cut, not refused (pawel-kow/epp#21)
    long_label_cut: true               # a domain label of 61 to 63 is stored cut, with no reply (pawel-kow/epp#30)
    host_attr_without_address_refused: true  # a hostAttr of an external host without addresses is refused (pawel-kow/epp#33)
    queue_del_no_msgcnt: false
