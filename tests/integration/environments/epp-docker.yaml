# The EPP test server of EPP-server-docker (docs/agents/testing.project.md#backend).
preset: epp-compatible               # the RPP preset the `{rpp:*}` placeholders stand for (a key of src/rpp/schema/schemas/presets)
server: epp-docker                     # epp-docker-checked runs over the same server: they share its mutexes, run hooks
max_workers: 8                         # and sessions; the backend refuses logins above about 16 sessions, so the workers
                                       # of a run times its environments of this server are at most 8
regacc: user                           # the sponsor id is the login
registrars:                            # the slots the cases name, each naming its variables in .env
  a:
    user: TEST_EPP_REGACC1
    password: TEST_EPP_REGACC1_PASSWORD
    prefix: TEST_EPP_REGACC1_PREFIX
  b:
    user: TEST_EPP_REGACC2
    password: TEST_EPP_REGACC2_PASSWORD
    prefix: TEST_EPP_REGACC2_PREFIX
# Not a secret: a user the backend does not know, for the failed logins. No case logs in to a test account with a
# wrong password.
unknown_user:
  user: ghost
  password: nope

# The facts of its server are those of its configuration (`rpp_protocol_config`, config/common.yaml); the
# descriptor states its singular exceptions only.
facts:
  # Defects of this server, which the cases it breaks do not run on.
  bugs:
    over_max_length_cut: true          # a value longer than its column is stored cut, not refused (pawel-kow/epp#21)
    long_label_cut: true               # a domain label of 61 to 63 is stored cut, with no reply (pawel-kow/epp#30)
    host_attr_without_address_refused: true  # a hostAttr of an external host without addresses is refused (pawel-kow/epp#33)
    queue_del_no_msgcnt: false
